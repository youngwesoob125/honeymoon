<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="신혼여행">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F8FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1733" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<title>우리 신혼여행</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F8FC; --card:#FFFFFF; --ink:#1C2440; --soft:#5D6684; --line:#DDE3F0;
  --azul:#2353B8; --azul-2:#E5ECFB; --tram:#FFC93C; --tram-2:#FFF4D1;
  --naranja:#E8692A; --naranja-2:#FDE7DA; --oliva:#4F8A35; --oliva-2:#E3F1DA;
  --dot:rgba(35,83,184,.09);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1733; --card:#18224A; --ink:#ECEFFA; --soft:#A2ABCB; --line:#2A3770;
    --azul:#8EA9FF; --azul-2:#22306A; --tram:#FFD45C; --tram-2:#3B3216;
    --naranja:#FF9A5A; --naranja-2:#3E2518; --oliva:#9BD07A; --oliva-2:#1F3420;
    --dot:rgba(142,169,255,.10);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1733; --card:#18224A; --ink:#ECEFFA; --soft:#A2ABCB; --line:#2A3770;
  --azul:#8EA9FF; --azul-2:#22306A; --tram:#FFD45C; --tram-2:#3B3216;
  --naranja:#FF9A5A; --naranja-2:#3E2518; --oliva:#9BD07A; --oliva-2:#1F3420;
  --dot:rgba(142,169,255,.10);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15.5px;line-height:1.6;
  background-color:var(--paper);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:18px 18px;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--azul);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.disp{font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400;letter-spacing:-.2px}
h2{font-family:"Jua",sans-serif;font-weight:400;font-size:21px;margin:26px 0 8px;display:flex;align-items:center;gap:8px}
h2 .em{font-size:20px}
.hint{color:var(--soft);font-size:13.5px;margin:-4px 0 10px}
.empty{color:var(--soft);background:var(--card);border:1.5px dashed var(--line);border-radius:14px;padding:14px;font-size:14px}
[hidden]{display:none!important}

/* 상단 */
.top{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 10px}
.top .name{font-family:"Jua",sans-serif;font-size:20px;color:var(--azul)}
.top .upd{font-size:12.5px;color:var(--soft);text-align:right}

/* 티켓 히어로 */
.ticket{position:relative;display:grid;grid-template-columns:1fr 92px;background:var(--card);border-radius:18px;overflow:hidden;
  box-shadow:0 2px 0 var(--line)}
.ticket .main{padding:16px 16px 14px;border-right:2px dashed var(--line);position:relative}
.ticket .main::before,.ticket .main::after{content:"";position:absolute;right:-11px;width:20px;height:20px;border-radius:50%;background:var(--paper)}
.ticket .main::before{top:-10px}.ticket .main::after{bottom:-10px}
.t-route{display:flex;align-items:center;gap:10px;font-family:"Jua",sans-serif}
.t-code{font-size:34px;line-height:1;color:var(--azul)}
.t-city{font-size:13px;color:var(--soft);font-family:"Gowun Dodum",sans-serif}
.t-plane{font-size:22px;flex:0 0 auto}
.t-meta{margin-top:10px;font-size:14px;color:var(--soft)}
.t-meta b{color:var(--ink);font-weight:400;font-family:"Jua",sans-serif;font-size:15px}
.stub{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--tram);color:#3A2A00;padding:10px 6px;text-align:center}
.stub .n{font-family:"Jua",sans-serif;font-size:34px;line-height:1}
.stub .l{font-size:12.5px;margin-top:4px}
.today .stub{background:var(--naranja);color:#fff}
.today-list{margin:8px 0 0;padding-left:18px;font-size:14.5px}
.today-list li{margin:2px 0}

/* 메모 브리핑 */
.memo{background:var(--tram-2);border-radius:4px 16px 16px 16px;padding:13px 15px;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.04)}
.memo::before{content:"";position:absolute;top:-9px;left:22px;width:54px;height:18px;background:rgba(255,201,60,.55);transform:rotate(-3deg);border-radius:2px}
.memo .d{font-size:12.5px;color:var(--soft)}
.memo h3{font-family:"Jua",sans-serif;font-weight:400;font-size:18px;margin:2px 0 6px;line-height:1.35}
.memo ul{margin:0;padding-left:18px;font-size:14.5px}
.memo li{margin:3px 0}

/* 카드 공통 */
.card{background:var(--card);border-radius:16px;padding:12px 14px;margin:8px 0;box-shadow:0 2px 0 var(--line)}
.prop{border:2px solid var(--azul-2)}
.prop.req{border-color:var(--naranja)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.chip{font-size:12.5px;padding:2px 10px;border-radius:999px;white-space:nowrap;font-weight:700}
.chip.blue{background:var(--azul-2);color:var(--azul)}
.chip.ora{background:var(--naranja-2);color:var(--naranja)}
.chip.ok{background:var(--oliva-2);color:var(--oliva)}
.chip.mute{background:var(--line);color:var(--soft)}
.btn{border:2px solid var(--azul);background:transparent;color:var(--azul);border-radius:12px;padding:7px 14px;cursor:pointer;font-family:"Jua",sans-serif;font-size:15px}
.btn.fill{background:var(--azul);color:var(--card)}
a.btn{display:inline-block;text-decoration:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.small{font-size:13px;color:var(--soft)}

/* 도시 스탬프 */
.stamps{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.stamp{flex:0 0 auto;scroll-snap-align:start;min-width:104px;padding:12px 10px 10px;background:var(--card);border-radius:10px;text-align:center;cursor:pointer;border:0;
  outline:2px dashed var(--azul);outline-offset:-6px;position:relative}
.stamp .c{font-family:"Jua",sans-serif;font-size:18px;color:var(--azul);display:block}
.stamp .dt{font-size:12px;color:var(--soft);display:block}
.stamp .h{font-size:12px;display:block;margin-top:4px}
.stamp .h.ok{color:var(--oliva)}.stamp .h.no{color:var(--naranja)}
.stamp.now{background:var(--tram-2)}
.edit{background:var(--card);border:2px solid var(--naranja);border-radius:14px;padding:12px 14px;margin:4px 0 6px}
.edit label{display:block;font-size:13.5px;color:var(--soft);margin:6px 0 3px}
.inp{width:100%;background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:9px 11px}
.chkrow{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14.5px}

/* 할 일 */
.task{display:grid;grid-template-columns:32px 1fr;gap:2px 10px;align-items:start;padding:11px 0;border-bottom:1.5px dashed var(--line)}
.task:last-child{border-bottom:0}
.chk{width:28px;height:28px;border:2.5px solid var(--azul);border-radius:9px;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.chk[aria-checked="true"]{background:var(--oliva);border-color:var(--oliva)}
.chk[aria-checked="true"]::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.chk:disabled{cursor:not-allowed;opacity:.55}
.tt{font-size:15px}
.task.done .tt{color:var(--soft);text-decoration:line-through}
.tm{grid-column:2;font-size:13px;color:var(--soft);display:flex;flex-wrap:wrap;gap:3px 10px}
.due.soon{color:var(--naranja);font-weight:700}.due.late{color:#C62E2E;font-weight:700}
.pp{color:var(--azul);font-weight:700}.who{color:var(--oliva)}
.month{font-family:"Jua",sans-serif;font-size:16px;color:var(--soft);margin:18px 0 4px}
details.fold{background:var(--card);border-radius:16px;margin:10px 0;padding:0 14px;box-shadow:0 2px 0 var(--line)}
details.fold summary{cursor:pointer;padding:12px 0;font-family:"Jua",sans-serif;font-size:17px;list-style:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"＋";float:right;color:var(--soft)}
details.fold[open] summary::after{content:"－"}

/* 일정 엽서 */
.day{background:var(--card);border-radius:16px;margin:12px 0;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.day-h{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left}
.dbadge{flex:0 0 auto;width:54px;height:58px;border-radius:12px;background:var(--azul-2);color:var(--azul);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Jua",sans-serif;line-height:1.05}
.dbadge .m{font-size:12px}.dbadge .dd{font-size:22px}.dbadge .w{font-size:12px}
.day.rest .dbadge{background:var(--oliva-2);color:var(--oliva)}
.day.today{outline:3px solid var(--naranja)}
.day.today .dbadge{background:var(--naranja);color:#fff}
.dh-txt{flex:1;min-width:0}
.dh-city{font-family:"Jua",sans-serif;font-size:17px;display:block}
.dh-head{font-size:13.5px;color:var(--soft);display:block}
.wchip{flex:0 0 auto;font-size:12.5px;background:var(--tram-2);border-radius:10px;padding:4px 8px;text-align:center;line-height:1.3}
.day-b{padding:0 14px 14px}
.day-b ul{margin:0;padding-left:18px}
.day-b li{margin:3px 0}
.dnote{font-size:13px;color:var(--soft);margin-top:8px;border-top:1.5px dashed var(--line);padding-top:8px}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pchip{font-size:13px;text-decoration:none;color:var(--azul);background:var(--azul-2);border-radius:999px;padding:4px 10px}
.pchip:hover{text-decoration:underline}

/* 지도 */
.mapbox{background:var(--card);border-radius:18px;padding:8px;box-shadow:0 2px 0 var(--line)}
.mapbox svg{display:block;width:100%;height:auto}
.land{fill:var(--azul-2);stroke:var(--azul);stroke-width:2;stroke-linejoin:round}
.border{fill:none;stroke:var(--azul);stroke-width:1.5;stroke-dasharray:4 5;opacity:.6}
.leg{fill:none;stroke:var(--naranja);stroke-width:3.5;stroke-linecap:round}
.leg.fly{stroke-dasharray:2 9}
.pin{cursor:pointer}
.pin circle.o{fill:var(--card);stroke:var(--azul);stroke-width:4}
.pin.sel circle.o{fill:var(--azul)}
.pin text.n{font-family:"Jua",sans-serif;font-size:23px;fill:var(--azul);text-anchor:middle;dominant-baseline:central}
.pin.sel text.n{fill:var(--card)}
.pin text.lb{font-family:"Jua",sans-serif;font-size:31px;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:8px;stroke-linejoin:round}
.spur{stroke:var(--naranja);stroke-width:3;stroke-linecap:round;stroke-dasharray:.5 7}
.dpin circle{fill:var(--naranja);stroke:var(--card);stroke-width:3}
.dpin.sel circle{stroke:var(--ink);stroke-width:4}
.dpin text{font-size:25px;fill:var(--naranja);font-family:"Jua",sans-serif;paint-order:stroke;stroke:var(--card);stroke-width:7px;stroke-linejoin:round}
.sea{font-family:"Jua",sans-serif;fill:var(--soft);font-size:26px;opacity:.7}
/* 범례: 카드 안 맨 아래, 점선 구분선 하나로만 나눈다 (따로 상자 없음) */
.legend{display:flex;justify-content:center;align-items:center;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--soft);margin-top:8px;padding:10px 4px 2px;border-top:1.5px dashed var(--line)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i.ln{display:inline-block;width:24px;height:0;border-top:3.5px solid var(--naranja)}
.legend i.ln.f{border-top-style:dotted}
.ddot{display:inline-block;flex:0 0 auto;width:10px;height:10px;border-radius:50%;background:var(--naranja)}
.mlink{display:inline-block;margin-top:10px;text-decoration:none}

/* 추천 */
.seg{display:flex;gap:6px;background:var(--card);border-radius:14px;padding:5px;box-shadow:0 2px 0 var(--line)}
.seg button{flex:1;border:0;border-radius:10px;padding:8px 0;background:transparent;cursor:pointer;font-family:"Jua",sans-serif;font-size:15.5px;color:var(--soft)}
.seg button[aria-selected="true"]{background:var(--azul);color:var(--card)}
.rec .top2{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rec .tl{font-family:"Jua",sans-serif;font-size:16.5px;line-height:1.35}
.rec .why{font-size:14px;margin-top:4px}
.rec .meta{font-size:13px;color:var(--soft);margin-top:4px}
.rec a{color:var(--azul)}
.wx{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.wx .tmp{font-family:"Jua",sans-serif;font-size:22px;color:var(--azul);text-align:right}
.fc{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.fc div{flex:0 0 auto;background:var(--paper);border-radius:10px;padding:5px 8px;font-size:12.5px;text-align:center}

/* 남기기 */
.req textarea{width:100%;min-height:62px;resize:vertical;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.rq{padding:9px 0;border-bottom:1.5px dashed var(--line);font-size:14px}
.rq:last-child{border-bottom:0}
.rq .reply{color:var(--oliva);font-size:13.5px;margin-top:2px}
.addf{margin-top:14px}
.addf>b{display:block;font-size:16px;margin-bottom:8px;color:var(--azul)}
.addrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.addrow label{flex:0 0 auto}
.addrow .inp{flex:1 1 auto;min-width:0;width:auto}


/* 예약 */
.bk{display:grid;grid-template-columns:62px 1fr;gap:2px 10px;padding:10px 0;border-bottom:1.5px dashed var(--line);cursor:pointer;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.bk:last-child{border-bottom:0}
.bk .bd{grid-row:span 2;background:var(--tram-2);border-radius:10px;text-align:center;font-family:"Jua",sans-serif;font-size:14px;line-height:1.25;padding:5px 2px;align-self:start}
.bk .bt{font-size:15px}
.bk .bm{font-size:13px;color:var(--soft)}
.bk.past{opacity:.55}
.bkday{background:var(--tram-2);border-radius:12px;padding:8px 10px;margin-bottom:10px;font-size:14px}
.bkday div{margin:2px 0}
.edit select,.edit textarea{width:100%;background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:9px 11px}
.edit textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.del{border-color:#C62E2E;color:#C62E2E}


/* 구간 길찾기 */
.lg{display:grid;grid-template-columns:62px 1fr;gap:2px 10px;padding:10px 0;border-bottom:1.5px dashed var(--line);text-decoration:none;color:inherit}
.lg:last-child{border-bottom:0}
.lg .bd{grid-row:span 2;background:var(--azul-2);color:var(--azul);border-radius:10px;text-align:center;font-family:"Jua",sans-serif;font-size:14px;line-height:1.25;padding:5px 2px;align-self:start}
.lg .bt{font-size:15px}
.lg .bm{font-size:13px;color:var(--soft)}
.lg .go{color:var(--azul);font-size:13px;white-space:nowrap}
.lg.past{opacity:.5}

.top .r{display:flex;align-items:center;gap:8px}
.rf{border:2px solid var(--line);background:var(--card);color:var(--azul);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:17px;line-height:1;display:grid;place-items:center;padding:0}
.rf.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ptr{position:fixed;left:50%;top:calc(6px + env(safe-area-inset-top,0px));transform:translate(-50%,-70px);background:var(--card);color:var(--azul);
  font-family:"Jua",sans-serif;font-size:14px;border-radius:999px;padding:7px 16px;box-shadow:0 2px 0 var(--line);z-index:7;pointer-events:none;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.rf.spin{animation:none}}

/* 하단 탭 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--card);border-top:2px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs .in{display:flex;width:100%;max-width:640px}
nav.tabs button{flex:1;border:0;background:transparent;cursor:pointer;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--soft);font-family:"Jua",sans-serif;font-size:12.5px}
nav.tabs button .ic{font-size:21px;line-height:1.1;filter:grayscale(.6);opacity:.75}
nav.tabs button[aria-current="page"]{color:var(--azul)}
nav.tabs button[aria-current="page"] .ic{filter:none;opacity:1;transform:translateY(-1px)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,520px);display:none;z-index:6}
.ro{background:var(--naranja-2);border-radius:12px;padding:9px 12px;font-size:13.5px;margin:6px 0}
@media (prefers-reduced-motion:no-preference){.chk,.pin circle.o{transition:all .15s}}

/* 웹앱 추가 */
.top .upd.off{color:var(--naranja);font-weight:700}
.hintcard{border:2px dashed var(--azul);margin-bottom:12px}
.acct{margin:22px 0 4px;text-align:center}
.linkbtn{border:0;background:none;color:var(--azul);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
#v-login{display:none}
body.gated #v-login{display:block}
body.gated .wrap>section:not(#v-login),body.gated nav.tabs,body.gated .top .r{display:none!important}
.loginbox{padding:24px 4px}
.loginbox h1{font-size:30px;color:var(--azul);margin:18px 0 8px;font-weight:400}
.loginbox p{font-size:15px}
.top .name{white-space:nowrap}
body.gated .top{display:none}
.tt{border:0;background:none;padding:0;text-align:left;cursor:pointer;font:inherit;font-size:15px;color:inherit}
.tt:disabled{cursor:default}
.btn.small-btn{font-size:13.5px;padding:5px 11px;border-width:1.5px}
.chip.mute{background:var(--line);color:var(--soft)}
.gmap{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.gmap iframe{display:block;width:100%;height:min(50vh,420px);border:0}
/* 도시 순서: 왼쪽 번호를 이동선(실선=기차·버스·차, 점선=비행기)으로 잇고, 당일치기는 같은 줄 오른쪽 */
.route{padding:6px 6px 10px}
.rt{position:relative;display:flex;align-items:center;border-radius:12px}
.rt.on{background:var(--azul-2)}
.rt.in::before,.rt.in-fly::before,.rt.out::after,.rt.out-fly::after{content:"";position:absolute;left:23.5px;width:0;border-left:3px solid var(--naranja)}
.rt.in::before,.rt.in-fly::before{top:0;height:50%}
.rt.out::after,.rt.out-fly::after{top:50%;bottom:0}
.rt.in-fly::before,.rt.out-fly::after{border-left-style:dotted}
.rt-c{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0 8px 10px;border:0;background:none;text-align:left;cursor:pointer;border-radius:12px;color:inherit}
.rt-n{position:relative;z-index:1;flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:var(--card);border:3px solid var(--azul);color:var(--azul);display:grid;place-items:center;font-family:"Jua",sans-serif;font-size:15px;line-height:1}
.rt-n.on{background:var(--azul);color:var(--card)}
.rt-t{flex:0 1 auto;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.rt-t b{font-family:"Jua",sans-serif;font-weight:400;font-size:17px;white-space:nowrap}
.rt-t b .chip{font-family:"Gowun Dodum",sans-serif;font-size:11.5px;padding:1px 7px;vertical-align:2px}
.rt-t>span{font-size:12.5px;color:var(--soft);white-space:nowrap}
.rt-line{flex:1 1 12px;min-width:12px;height:0;border-top:2.5px dotted var(--naranja);opacity:.7;margin-left:2px}
.rt-d{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:36px;margin:0 8px 0 6px;padding:0 12px;border-radius:999px;border:2px solid var(--naranja-2);background:var(--card);color:var(--naranja);font-family:"Jua",sans-serif;font-size:14.5px;cursor:pointer;white-space:nowrap}
.rt-d small{font-family:"Gowun Dodum",sans-serif;font-size:12px;color:var(--soft)}
.rt-d[aria-pressed="true"]{background:var(--naranja);border-color:var(--naranja);color:var(--card)}
.rt-d[aria-pressed="true"] small{color:var(--card)}
.rt-d[aria-pressed="true"] .ddot{background:var(--card)}
.route .legend{margin:6px 6px 0}
/* 고른 도시·당일치기 */
.selhead{border:2px solid var(--azul-2);margin-top:14px}
.selhead.trip{border-color:var(--naranja-2)}
.selhead .sh{display:flex;align-items:center;gap:12px}
.selhead .sh b{font-size:20px;line-height:1.2}
.selhead .pchips{margin-top:10px}
.tdot{flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:var(--naranja);box-shadow:inset 0 0 0 7px var(--naranja-2)}
button.pchip{border:0;cursor:pointer;font-family:inherit}
.pchip.trip{display:inline-flex;align-items:center;gap:6px;background:var(--naranja-2);color:var(--naranja)}
.dtag{display:inline-flex;align-items:center;gap:5px;vertical-align:2px;font-family:"Gowun Dodum",sans-serif;font-size:12px;font-weight:700;line-height:1.5;color:var(--naranja);background:var(--naranja-2);border:0;border-radius:999px;padding:1px 9px 1px 7px;white-space:nowrap}
button.dtag{cursor:pointer}
.dtag .ddot{width:8px;height:8px}
.sday .row{align-items:center}
.mlegs{margin-top:10px;border-top:1.5px dashed var(--line);padding-top:6px}
.mleg{display:flex;gap:10px;align-items:baseline;justify-content:space-between;padding:5px 0;font-size:14px;color:inherit;text-decoration:none}
.mleg .go{flex:0 0 auto;color:var(--azul);font-size:13px}
/* 접는 카드 안의 그림 지도는 카드와 한 몸으로 (안쪽 상자·그림자 없음) */
details.fold .mapbox{background:none;box-shadow:none;border-radius:0;padding:0 0 12px}
.net{background:var(--naranja-2);color:var(--ink);border-radius:12px;padding:9px 12px;font-size:13.5px;margin:0 0 10px}

/* ---------- 공통 추가 ---------- */
.h2row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.h2row h2{margin-bottom:8px}
.more{border:0;background:none;color:var(--azul);font-family:"Jua",sans-serif;font-size:14.5px;cursor:pointer;padding:6px 2px;margin-top:18px;white-space:nowrap}
.back{border:0;background:none;color:var(--azul);font-family:"Jua",sans-serif;font-size:15px;cursor:pointer;padding:4px 0;margin:0 0 -6px}
.clip{font-size:12px;color:var(--soft);white-space:nowrap}
h3.sub{font-family:"Jua",sans-serif;font-weight:400;font-size:17px;margin:18px 0 6px}
.segs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.segs::-webkit-scrollbar{display:none}
.sg{flex:0 0 auto;border:2px solid var(--line);background:var(--card);color:var(--soft);border-radius:999px;padding:7px 13px;font-family:"Jua",sans-serif;font-size:15px;cursor:pointer;white-space:nowrap}
.sg[aria-selected="true"]{background:var(--azul);border-color:var(--azul);color:var(--card)}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;margin:0 -2px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 11px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--azul-2);border-color:var(--azul);color:var(--azul);font-weight:700}
.fchip.favf[aria-pressed="true"]{background:var(--naranja-2);border-color:var(--naranja);color:var(--naranja)}
.chipsel{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.cs{position:relative;cursor:pointer}
.cs input{position:absolute;opacity:0;pointer-events:none}
.cs span{display:inline-block;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap}
.cs input:checked+span{background:var(--azul);border-color:var(--azul);color:var(--card);font-weight:700}
.cs input:focus-visible+span{outline:2.5px solid var(--azul);outline-offset:2px}
body.ovopen{overflow:hidden}

/* ---------- 여행 중 '오늘' ---------- */
.todayp{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 2px 0 var(--line);border-top:6px solid var(--naranja)}
.tp-h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft)}
.tp-day{background:var(--naranja);color:#fff;border-radius:999px;padding:1px 9px;font-weight:700}
.tp-h .chip{border:0;cursor:pointer;margin-left:auto}
.tp-city{display:block;font-size:26px;line-height:1.2;margin-top:4px;color:var(--ink)}
.tp-next{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;background:var(--tram-2);border-radius:12px;padding:10px 12px;margin-top:10px}
.tp-next .tp-in{grid-column:2;color:var(--naranja);font-weight:700;font-size:13.5px}
.tp-next.done{grid-template-columns:auto 1fr}
.tp-lab{font-family:"Jua",sans-serif;font-size:13px;color:var(--soft);white-space:nowrap}
.tp-list{margin:10px 0 0;padding-left:20px;font-size:14.5px}
.tp-list li{margin:3px 0}
.tp-list li.past{color:var(--soft);opacity:.7}
.tp-list li.cur{font-weight:700}
.tp-list li.cur::marker{color:var(--naranja)}
.tp-sec{margin-top:12px;border-top:1.5px dashed var(--line);padding-top:8px}
.tp-tix{display:flex;gap:8px;overflow-x:auto;margin-top:6px}
.tix{flex:0 0 auto;width:92px;border:0;background:none;padding:0;text-align:center;font-size:12.5px;cursor:pointer;color:inherit}
.tix .wthumb{width:92px;height:92px}
.tp-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--soft);margin-top:10px}

/* ---------- 지갑 ---------- */
.wst{font-size:13.5px;background:var(--azul-2);color:var(--ink);border-radius:12px;padding:9px 12px;margin-top:10px}
.wst.ok{background:var(--oliva-2)}
.wrow{display:grid;grid-template-columns:62px 1fr;gap:2px 10px;padding:10px 0;border-bottom:1.5px dashed var(--line)}
.wrow:last-child{border-bottom:0}
.wrow .bd{background:var(--tram-2);border-radius:10px;text-align:center;font-family:"Jua",sans-serif;font-size:14px;line-height:1.25;padding:5px 2px;align-self:start}
.wr-b{min-width:0}
.wr-b .bt{font-size:15px}
.wr-b .bm{font-size:13px;color:var(--soft)}
.wfiles{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.wf{border:0;background:none;padding:0;width:76px;text-align:center;cursor:pointer;color:inherit}
.wfl{display:block;font-size:11.5px;line-height:1.3;margin-top:3px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wthumb{position:relative;display:grid;place-items:center;width:76px;height:76px;border-radius:12px;overflow:hidden;background:var(--paper);border:1.5px solid var(--line)}
.wthumb img{width:100%;height:100%;object-fit:cover;background:#fff}
.wthumb i{position:absolute;left:4px;bottom:4px;font-style:normal;font-size:10.5px;font-weight:700;background:rgba(28,36,64,.78);color:#fff;border-radius:6px;padding:1px 5px}
.wthumb.miss::after{content:"📴";font-size:20px;opacity:.6}
.wadd-s{border:1.5px dashed var(--line);background:none;color:var(--azul);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.wf.add .wthumb{border-style:dashed;color:var(--azul);font-size:26px;font-family:"Jua",sans-serif}
.wdocs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wdoc{display:flex;gap:10px;align-items:center;background:var(--card);border:0;border-radius:14px;padding:8px;box-shadow:0 2px 0 var(--line);text-align:left;cursor:pointer;color:inherit;font-size:14px}
.wdoc .wthumb{width:54px;height:54px;flex:0 0 54px}
.wdoc small{display:block;color:var(--soft);font-size:12px}
/* 경비 */
.exs-t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.exs-t b{font-size:26px;color:var(--azul)}
.exd{margin-top:8px;border-top:1.5px dashed var(--line);padding-top:6px}
.exd summary{cursor:pointer;font-family:"Jua",sans-serif;font-size:15px;list-style:none}
.exd summary::-webkit-details-marker{display:none}
.exd summary::after{content:" ＋";color:var(--soft)}
.exd[open] summary::after{content:" －"}
.bar{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bar .bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .bt{height:10px;background:var(--paper);border-radius:999px;overflow:hidden}
.bar .bt i{display:block;height:100%;background:var(--azul);border-radius:999px}
.bar .bv{font-size:12.5px;color:var(--soft);white-space:nowrap}
.exday{display:flex;justify-content:space-between;font-size:15px}
.exr{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;width:100%;padding:9px 0;border:0;border-bottom:1.5px dashed var(--line);background:none;text-align:left;cursor:pointer;color:inherit}
.exr:last-child{border-bottom:0}
.exi{font-size:20px;text-align:center}
.exm{font-size:14.5px;min-width:0}
.exm small,.exa small{display:block;font-size:12px;color:var(--soft)}
.exa{text-align:right;font-family:"Jua",sans-serif;font-size:15.5px;white-space:nowrap}
.exrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.exrow .inp{flex:1 1 120px;width:auto;font-size:20px}

/* ---------- 발견 ---------- */
.dc .top2{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.dc .tl{font-family:"Jua",sans-serif;font-size:16.5px;line-height:1.35}
.dchips{display:flex;gap:4px;flex:0 0 auto}
.dc.isnew{border:2px solid var(--oliva-2)}
.dc .meta{font-size:13px;color:var(--soft);margin-top:3px}
.dc .why{font-size:14.5px;margin-top:6px}
.dl{font-size:13.5px;margin-top:5px;line-height:1.55}
.dl b{font-family:"Jua",sans-serif;font-weight:400;color:var(--soft);margin-right:4px}
.dl.warn{background:var(--naranja-2);border-radius:10px;padding:6px 9px}
.dl a,.src a{color:var(--azul)}
.src{font-size:12px;color:var(--soft);margin-top:8px;border-top:1.5px dashed var(--line);padding-top:6px}
.btn.fav.on{background:var(--naranja-2);border-color:var(--naranja);color:var(--naranja)}
.favw{margin-top:4px;color:var(--naranja)}
.linkf{margin-top:18px;border:2px dashed var(--azul)}
.linkf .inp{margin-top:8px}

/* ---------- 겹쳐 뜨는 화면 ---------- */
#ov{position:fixed;inset:0;z-index:9}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ovbar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 16px;background:var(--card);border-bottom:2px solid var(--line)}
.ovbar b{font-family:"Jua",sans-serif;font-weight:400;font-size:18px}
.ovx{flex:0 0 auto;width:40px;height:40px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.ov.viewer{background:#fff;color:#111}
.ov.viewer .ovbar{background:#fff;border-color:#e5e5e5}
.ov.viewer .ovbar .small{color:#666}
.ov.viewer .ovx{background:#fff;color:#111;border-color:#ddd}
.ovbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px;display:flex;flex-direction:column;gap:10px;align-items:center}
.ovbody img{max-width:100%;height:auto;display:block;border:1px solid #eee}
.miss-txt{color:#666;font-size:14px;padding:30px 10px;text-align:center}
.ovfoot{display:flex;gap:8px;justify-content:center;padding:10px;background:#fff;border-top:1px solid #eee}
.ov.driver{background:#fff;color:#000}
.ov.driver .ovbar{background:#fff;border-color:#e5e5e5}
.ov.driver .ovbar .small{color:#555}
.ov.driver .ovx{background:#fff;color:#000;border-color:#ddd}
.dv{flex:1;overflow:auto;padding:22px 20px 10px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.dv-say{font-size:22px;margin:0 0 18px;color:#333;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
.dv-name{font-size:34px;font-weight:800;line-height:1.2;margin:0 0 12px;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;letter-spacing:-.3px}
.dv-addr{font-size:26px;line-height:1.35;margin:0 0 12px;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
.dv-tel a{font-size:22px;color:#0b57d0;text-decoration:none}
.dv-ko{font-size:14px;color:#666;margin:8px 0 0}
.dv-pick{justify-content:center;flex-wrap:wrap;padding:8px 12px}
.ov.driver .fchip{background:#fff;color:#000;border-color:#ccc}
.ov.driver .fchip[aria-pressed="true"]{background:#000;color:#fff;border-color:#000}
.ov.driver .btn{color:#0b57d0;border-color:#0b57d0}
.ov.driver .btn.fill{background:#0b57d0;color:#fff}
.sosb{flex:1;overflow:auto;padding:12px 16px 20px}
.sosr{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:11px 14px;margin:8px 0;text-decoration:none;color:inherit;box-shadow:0 2px 0 var(--line)}
.sosr b{display:block;font-size:15px}
.sosr small{display:block;font-size:12.5px;color:var(--soft)}
.sosn{font-family:"Jua",sans-serif;font-size:18px;color:var(--azul);white-space:nowrap}
.sosb h4{font-family:"Jua",sans-serif;font-weight:400;font-size:17px;margin:18px 0 6px}
.sos-steps{margin:0;padding-left:20px;font-size:14px}
.sosm{background:var(--card);border-radius:12px;padding:9px 12px;margin:6px 0;font-size:14px}
.sosm b{display:block;font-family:"Jua",sans-serif;font-weight:400;color:var(--soft);font-size:13.5px}
.sosb label{display:block;font-size:13.5px;color:var(--soft);margin:10px 0 3px}
.sosb textarea{width:100%;resize:vertical}

/* ---------- 홈 도구 줄 ---------- */
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 2px}
.tools button{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--card);border:0;border-radius:14px;padding:10px 4px 9px;box-shadow:0 2px 0 var(--line);cursor:pointer;color:var(--ink);min-width:0}
.tools .ti{font-size:22px;line-height:1.15}
.tools b{font-family:"Jua",sans-serif;font-weight:400;font-size:15px;line-height:1.3}
.tools small{font-size:11.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* ---------- 짐 ---------- */
.pkseg small{font-size:12.5px;opacity:.85}
.pkbar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:10px 2px 12px}
.pkbar i{display:block;height:100%;background:var(--oliva);border-radius:999px;transition:width .3s}
/* ---------- 회화 ---------- */
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 2px 4px}
.phr{background:var(--card);border-radius:14px;padding:10px 12px;margin:8px 0;box-shadow:0 2px 0 var(--line)}
.ph-ko{font-size:13.5px;color:var(--soft)}
.ph-row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.ph-t{font-size:18px;font-weight:700;line-height:1.35;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;margin-top:2px}
.ph-k{font-size:13px;color:var(--azul);margin-top:2px}
.ph-n{font-size:12.5px;color:var(--soft);margin-top:7px;border-top:1.5px dashed var(--line);padding-top:5px}
.ph-b{display:flex;gap:6px;flex:0 0 auto}
.ico{width:42px;height:42px;border-radius:12px;border:2px solid var(--azul-2);background:var(--azul-2);color:var(--azul);font-size:18px;cursor:pointer;display:grid;place-items:center;padding:0;flex:0 0 auto}
.ico.on{background:var(--azul);color:var(--card);border-color:var(--azul)}
.ph-big{font-size:36px}
/* ---------- 하루 기록·앨범 ---------- */
.jday{margin-top:12px;border-top:1.5px dashed var(--line);padding-top:8px}
.jhd{font-family:"Jua",sans-serif;font-size:14.5px;color:var(--soft)}
.jent{margin:8px 0}
.jwho{font-family:"Jua",sans-serif;font-size:13.5px;color:var(--naranja)}
.jtxt{font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.jph{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.jth{position:relative;display:block;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:var(--paper);border:1.5px solid var(--line);padding:0;cursor:pointer;margin:0}
.jth img{width:100%;height:100%;object-fit:cover;display:block}
.jth img.miss{visibility:hidden}
.jadd{display:grid;place-items:center;font-size:26px;color:var(--azul);border:2px dashed var(--azul)}
.jx{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:999px;border:0;background:rgba(0,0,0,.62);color:#fff;font-size:12px;cursor:pointer;padding:0}
.btn.done-b{border-color:var(--oliva);color:var(--oliva)}
.album .aday{background:var(--card);border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:0 2px 0 var(--line)}
.ahd{display:flex;gap:12px;align-items:center}
.ahd > div{flex:1;min-width:0}
.album .jph{grid-template-columns:repeat(3,1fr)}
.ov.pv .pvb{justify-content:center;background:#111;padding:0}
.ov.pv .pvb img{max-width:100%;max-height:100%;object-fit:contain;border:0}
.cal-steps{margin:6px 0 0;padding-left:20px}
.calhelp{margin-top:10px;font-size:13.5px}
.calhelp summary{cursor:pointer;color:var(--azul);font-size:13.5px}
.sosb .jadd{display:grid;place-items:center;margin:0;font-size:26px;color:var(--azul)}
@media print{
  .top,.net,nav.tabs,.back,.noprint,.ico,.hint,#ptr,#toast{display:none!important}
  body{background:#fff;color:#000}
  .album .aday{break-inside:avoid;box-shadow:none;border:1px solid #ccc}
}


/* 대비책 */
.ptag{display:inline-flex;align-items:center;gap:3px;vertical-align:2px;font-family:"Gowun Dodum",sans-serif;font-size:12px;font-weight:700;line-height:1.5;color:var(--azul);background:var(--azul-2);border-radius:999px;padding:1px 8px;white-space:nowrap}
.ptag.act{color:var(--naranja);background:var(--naranja-2)}
.pl-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1.5px dashed var(--line);padding:9px 0;cursor:pointer;color:var(--ink);font:inherit;font-size:14.5px}
.pl-row:last-child{border-bottom:0}
.pl-row>span:nth-child(2){flex:1;min-width:0}
.pl-row .go{color:var(--azul);font-family:"Jua",sans-serif;font-size:13.5px;white-space:nowrap}
.pl-row.act>span:nth-child(2){font-weight:700}
.pl-day{margin-top:10px;border-top:1.5px dashed var(--line);padding-top:6px}
